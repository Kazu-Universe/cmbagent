  **Results:**

  <Findings relevant to the sub-task, in your own words, with IDs attached.>

  **Gaps:**

  <What these indexes did not cover, including paywalled or unindexed sources
  (e.g. MathSciNet-only records), so the planner can decide what to do next.>
